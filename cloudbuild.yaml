steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-heart-studies-backend:$COMMIT_SHA",
        ".",
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-heart-studies-backend:$COMMIT_SHA",
      ]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "rag-heart-studies-backend"
      - "--image=europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-heart-studies-backend:$COMMIT_SHA"
      - "--region=europe-west3"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--memory=512Mi"

images:
  - "europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-heart-studies-backend:$COMMIT_SHA"
